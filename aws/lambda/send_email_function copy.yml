SendEmailFunction:
  Type: AWS::Lambda::Function
  Properties:
    FunctionName: sendEmail
    Runtime: ruby3.4
    Handler: lambda_function.lambda_handler
    PackageType: Zip
    MemorySize: 512
    Timeout: 3
    Role: !Ref SendEmailRoleArn
    Code:
      S3Bucket: !Ref LambdaCodeBucket
      S3Key: !Sub 'functions/${CodeVersion}/send_email.zip'
    Environment:
      Variables:
        MONITOR_EMAIL_ADDRESS: !Ref MonitorEmailAddress
    LoggingConfig:
      LogFormat: Text
      LogGroup: '/aws/lambda/sendEmail'

SendEmailEventSource:
  Type: AWS::Lambda::EventSourceMapping
  Properties:
    EventSourceArn: !Ref OutboxTableStreamArn
    FunctionName: !Ref SendEmailFunction
    StartingPosition: LATEST
    BatchSize: 1
    MaximumBatchingWindowInSeconds: 0
    ParallelizationFactor: 1
    FilterCriteria:
      Filters:
        - Pattern: '{ "eventName": ["INSERT"] }'
