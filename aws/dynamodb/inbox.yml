InboxTable:
  Type: AWS::DynamoDB::Table
  Properties:
    TableName: inbox
    AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      - AttributeName: message_id
        AttributeType: S
    KeySchema:
      - AttributeName: user_id
        KeyType: HASH
      - AttributeName: message_id
        KeyType: RANGE
    BillingMode: PAY_PER_REQUEST
    StreamSpecification:
      StreamViewType: NEW_AND_OLD_IMAGES
    DeletionProtectionEnabled: false