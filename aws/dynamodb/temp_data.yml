TempDataTable:
TempHumidityTable:
  Type: AWS::DynamoDB::Table
  Properties:
    TableName: temp_data
    AttributeDefinitions:
      - AttributeName: device_id
        AttributeType: S
      - AttributeName: published_at
        AttributeType: S
    KeySchema:
      - AttributeName: device_id
        KeyType: HASH
      - AttributeName: published_at
        KeyType: RANGE
    BillingMode: PROVISIONED
    ProvisionedThroughput:
      ReadCapacityUnits: 1
      WriteCapacityUnits: 1
    DeletionProtectionEnabled: false
