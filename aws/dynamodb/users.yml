UsersTable:
  Type: AWS::DynamoDB::Table
  Properties:
    TableName: users
    AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      - AttributeName: active
        AttributeType: S
      - AttributeName: tempAlert
        AttributeType: S
      - AttributeName: heartbeatAlert
        AttributeType: S
    KeySchema:
      - AttributeName: user_id
        KeyType: HASH
    BillingMode: PROVISIONED
    ProvisionedThroughput:
      ReadCapacityUnits: 1
      WriteCapacityUnits: 1
    GlobalSecondaryIndexes:
      - IndexName: tempAlert-index
        KeySchema:
          - AttributeName: tempAlert
            KeyType: HASH
        Projection:
          ProjectionType: ALL
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
      - IndexName: active-index
        KeySchema:
          - AttributeName: active
            KeyType: HASH
        Projection:
          ProjectionType: ALL
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
      - IndexName: heartbeatAlert-index
        KeySchema:
          - AttributeName: heartbeatAlert
            KeyType: HASH
        Projection:
          ProjectionType: ALL
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
    DeletionProtectionEnabled: false

