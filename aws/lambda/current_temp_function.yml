CurrentTempFunction:
  Type: AWS::Lambda::Function
  Properties:
    FunctionName: currentTemp
    Runtime: ruby3.4
    Handler: lambda_function.lambda_handler
    PackageType: Zip
    MemorySize: 128
    Timeout: 30
    Role: !Ref CurrentTempRoleArn
    Code:
      S3Bucket: !Ref LambdaCodeBucket
      S3Key: !Sub 'functions/${CodeVersion}/current_temp.zip'
    Environment:
      Variables:
        DEVICE_ID: !Ref DeviceId
    LoggingConfig:
      LogFormat: Text
      LogGroup: '/aws/lambda/currentTemp'

CurrentTempEventSource:
  Type: AWS::Lambda::EventSourceMapping
  Properties:
    EventSourceArn: !Ref InboxTableStreamArn
    FunctionName: !Ref CurrentTempFunction
    StartingPosition: LATEST
    BatchSize: 10
    MaximumBatchingWindowInSeconds: 3
    ParallelizationFactor: 1
    FilterCriteria:
      Filters:
        - Pattern: '{ "eventName": ["INSERT"], "dynamodb": { "NewImage": { "message_body": { "S": ["Current", "current", "temp", "Temp", "currenttemp", "Currenttemp"] } } } }'
