SMSProcessorFunction:
  Type: AWS::Lambda::Function
  Properties:
    FunctionName: smsProcessor
    Runtime: ruby3.4
    Handler: lambda_function.lambda_handler
    PackageType: Zip
    MemorySize: 128
    Timeout: 3
    Role: !Ref SMSProcessorRoleArn
    Code:
      S3Bucket: !Ref LambdaCodeBucket
      S3Key: !Sub 'functions/${CodeVersion}/sms_processor.zip'
    LoggingConfig:
      LogFormat: Text
      LogGroup: '/aws/lambda/smsProcessor'