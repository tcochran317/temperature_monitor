SendEmailRole:
  Type: AWS::IAM::Role
  Properties:
    RoleName: sendEmailRole
    Description: Execution role for the sendEmail function
    MaxSessionDuration: 3600
    AssumeRolePolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
    Policies:
      - PolicyName: sendEmailLogging
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: 'logs:CreateLogGroup'
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
            - Effect: Allow
              Action:
                - 'logs:CreateLogStream'
                - 'logs:PutLogEvents'
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sendEmail:*'
      - PolicyName: updateOutbox
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: 'dynamodb:UpdateItem'
              Resource: !Ref OutboxTableArn
      - PolicyName: consumeOutboxStream
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'dynamodb:DescribeStream'
                - 'dynamodb:GetRecords'
                - 'dynamodb:GetShardIterator'
              Resource: !Ref OutboxTableStreamArn
            - Effect: Allow
              Action: 'dynamodb:ListStreams'
              Resource: '*'
      - PolicyName: sendSESEmail
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: 'ses:SendEmail'
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
