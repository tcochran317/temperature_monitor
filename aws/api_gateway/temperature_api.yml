TemperatureApi:
  Type: AWS::ApiGateway::RestApi
  Properties:
    Name: temperature
    Description: Temperature data input handler
    ApiKeySourceType: HEADER
    DisableExecuteApiEndpoint: false
    EndpointConfiguration:
      Types:
        - REGIONAL

TemperatureResource:
  Type: AWS::ApiGateway::Resource
  DependsOn:
    - TemperatureApi
  Properties:
    RestApiId: !Ref TemperatureApi
    ParentId: !GetAtt TemperatureApi.RootResourceId
    PathPart: temp_humidity

TemperatureErrorModel:
  Type: AWS::ApiGateway::Model
  DependsOn:
    - TemperatureApi
  Properties:
    RestApiId: !Ref TemperatureApi
    Name: Error
    ContentType: application/json
    Description: 'Default error schema model'
    Schema: |
      {
        "$schema": "http://json-schema.org/draft-04/schema#",
        "title": "Error Schema",
        "type": "object",
        "properties": {
          "message": { "type": "string" }
        }
      }

TemperatureEmptyModel:
  Type: AWS::ApiGateway::Model
  DependsOn:
    - TemperatureApi
  Properties:
    RestApiId: !Ref TemperatureApi
    Name: Empty
    ContentType: application/json
    Description: 'Default empty schema model'
    Schema: |
      {
        "$schema": "http://json-schema.org/draft-04/schema#",
        "title": "Empty Schema",
        "type": "object"
      }

TemperaturePOSTMethod:
  Type: AWS::ApiGateway::Method
  DependsOn:
    - TemperatureResource
    - TemperatureEmptyModel
  Properties:
    RestApiId: !Ref TemperatureApi
    ResourceId: !Ref TemperatureResource
    HttpMethod: POST
    AuthorizationType: NONE
    ApiKeyRequired: false
    Integration:
      Type: AWS
      IntegrationHttpMethod: POST
      Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:dynamodb:action/PutItem'
      Credentials: !Ref ApiGatewayRoleArn
      CacheNamespace: !Ref TemperatureResource
      PassthroughBehavior: WHEN_NO_TEMPLATES
      RequestTemplates:
        application/json: |
          {
              "TableName": "temp_data",
              "Item": {
                  "id": { "S": "$context.requestId" },
                  "device_id": { "S": "$input.path('$.coreid')" },
                  "published_at": { "S": "$input.path('$.published_at')" },
                  "temp_f": { "N": "$input.path('$.data.temp_f')" },
                  "temp_c": { "N": "$input.path('$.data.temp_c')" },
                  "humidity": { "N": "$input.path('$.data.humidity')" }
              }
          }
      IntegrationResponses:
        - StatusCode: '200'
    MethodResponses:
      - StatusCode: '200'
        ResponseModels:
          application/json: Empty

TemperatureDeployment:
  Type: AWS::ApiGateway::Deployment
  DependsOn:
    - TemperaturePOSTMethod
  Properties:
    RestApiId: !Ref TemperatureApi

TemperatureLiveStage:
  Type: AWS::ApiGateway::Stage
  DependsOn:
    - TemperatureApi
    - ApiGatewayAccount
  Properties:
    RestApiId: !Ref TemperatureApi
    DeploymentId: !Ref TemperatureDeployment
    StageName: live
