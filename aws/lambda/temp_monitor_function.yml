TempMonitorFunction:
  Type: AWS::Lambda::Function
  Properties:
    FunctionName: tempMonitor
    Runtime: ruby3.4
    Handler: lambda_function.lambda_handler
    PackageType: Zip
    MemorySize: 128
    Timeout: 60
    Role: !Ref TempMonitorRoleArn
    Code:
      S3Bucket: !Ref LambdaCodeBucket
      S3Key: !Sub 'functions/${CodeVersion}/temp_monitor.zip'
    Environment:
      Variables:
        ALERT_TEMP: !Ref AlertTempF
        DEVICE_ID: !Ref DeviceId
    LoggingConfig:
      LogFormat: Text
      LogGroup: '/aws/lambda/tempMonitor'

TempMonitorSchedule:
  Type: AWS::Scheduler::Schedule
  Properties:
    Name: TempMonitorSchedule
    Description: Periodically invokes tempMonitor to check for out-of-range readings
    ScheduleExpression: !Ref MonitorScheduleExpression
    FlexibleTimeWindow:
      Mode: 'OFF'
    Target:
      Arn: !GetAtt TempMonitorFunction.Arn
      RoleArn: !Ref TempMonitorSchedulerRoleArn
