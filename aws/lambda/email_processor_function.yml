EmailProcessorFunction:
  Type: AWS::Lambda::Function
  Properties:
    FunctionName: emailProcessor
    Runtime: ruby3.4
    Handler: lambda_function.lambda_handler
    PackageType: Zip
    MemorySize: 512
    Timeout: 3
    Role: !Ref EmailProcessorRoleArn
    Code:
      S3Bucket: !Ref LambdaCodeBucket
      S3Key: !Sub 'functions/${CodeVersion}/email_processor.zip'
    LoggingConfig:
      LogFormat: Text
      LogGroup: '/aws/lambda/emailProcessor'
