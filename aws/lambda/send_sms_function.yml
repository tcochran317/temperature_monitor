SendSMSFunction:
  Type: AWS::Lambda::Function
  Properties:
    FunctionName: sendSMS
    Runtime: ruby3.4
    Handler: lambda_function.lambda_handler
    PackageType: Zip
    MemorySize: 128
    Timeout: 30
    Role: !Ref SendSMSRoleArn
    Layers:
      - !Ref TwilioClientLayer
    Code:
      S3Bucket: !Ref LambdaCodeBucket
      S3Key: !Sub 'functions/${CodeVersion}/send_sms.zip'
    Environment:
      Variables:
        TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
        TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
        TWILIO_PHONE_NUMBER: !Ref TwilioPhoneNumber
    LoggingConfig:
      LogFormat: Text
      LogGroup: '/aws/lambda/sendSMS'

SendSMSEventSource:
  Type: AWS::Lambda::EventSourceMapping
  Properties:
    EventSourceArn: !Ref OutboxTableStreamArn
    FunctionName: !Ref SendSMSFunction
    StartingPosition: LATEST
    BatchSize: 10
    MaximumBatchingWindowInSeconds: 3
    ParallelizationFactor: 1
    FilterCriteria:
      Filters:
        - Pattern: '{ "eventName": ["INSERT"] }'
